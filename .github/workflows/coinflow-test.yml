name: CoinFlow application repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic Cash Log and Lending repair
        run: python3 repair_cashlog.py

      - name: Commit application change to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm .github/workflows/coinflow-test.yml .github/repair-trigger-final.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No application changes detected"
            exit 0
          fi
          git commit -m "fix: restore working cash log and lending hub controls"
          git push
