name: Restore CoinFlow cash log and lending controls

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          import base64

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = 'COINFLOW_CASHLOG_LENDING_RESTORE_V2'

          if marker not in text:
              modal_html = base64.b64decode(' ','base64').decode()
              toggle_html = base64.b64decode('','base64').decode()
              helper_script = base64.b64decode(' bGVuZGluZy12aWV3LWJvcnJvd2VkIik7aWYobClgICBsLmFkZEV2ZW50TGlzdGVuZXIoImNsaWNrIixmdW5jdGlvbighKXtzZXRWaWV3KCJsZW50Iil9KTtpZihiKXtiLmFkZEV2ZW50TGlzdGVuZXIoImNsaWNrIixmdW5jdGlvbighKXtzZXRWaWV3KCJib3Jyb3dlZCIpfSl9c2V0Vmlldygi bGVudCIpfWlmKGRvY3VtZW50LnJlYWR5U3RhdGU9PT0ibG9hZGluZyIpcmRvY3VtZW50LmFkZEV2ZW50TGlzdGVuZXIoIkRPTUNvbnRlbnRMb2FkZWQiLGJvb3QseyBvbmNlIjp0cnVlIH0pO2Vsc2UgYm9vdCgpfSkoKTs8L3NjcmlwdD4=','base64').decode()

              anchor = '    <footer class="w-full border-t border-slate-900 py-6 text-center text-xs text-muted mt-auto">'
              if anchor not in text:
                  raise SystemExit('Footer anchor not found')
              text = text.replace(anchor, modal_html + '\n\n' + anchor, 1)

              route_anchor = '                    <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-6"><div class="p-6 rounded-2xl border interactive-card"><span class="text-xs text-slate-500">Total Lent Outstanding</span>'
              if route_anchor not in text:
                  raise SystemExit('Lending Hub anchor not found')
              text = text.replace(route_anchor, toggle_html + '\n' + route_anchor, 1)

              text = text.replace('</body>', helper_script + '\n</body>', 1)
              path.write_text(text, encoding='utf-8')
              print('Cash Log and Lending restore applied')

      - name: Commit patched index and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/restore-cashlog-lending.yml
          git commit -m "fix: restore cash log modal and lending controls"
          git push
