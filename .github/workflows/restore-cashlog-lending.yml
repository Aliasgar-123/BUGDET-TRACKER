name: Restore CoinFlow cash log and lending controls

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Cash Log modal and Lending controls
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = 'COINFLOW_CASHLOG_LENDING_RESTORE_V2'

          if marker not in text:
              modal_html = r'''
              <!-- COINFLOW_CASHLOG_LENDING_RESTORE_V2 -->
              <!-- Quick Add Transaction Modal restored from previous working Cash Log -->
              <div id="transaction-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm hidden">
                  <div class="w-full max-w-md rounded-2xl border p-6 bg-slate-900 border-amber-500/40 shadow-[0_0_30px_rgba(245,158,11,0.2)]">
                      <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
                          <div class="flex space-x-4">
                              <button type="button" id="modal-tab-add" class="text-lg font-bold text-amber-400 border-b-2 border-amber-400 pb-1">Add Record</button>
                              <button type="button" id="modal-tab-config" class="text-lg font-medium text-muted pb-1 hover:text-amber-300">Custom Categories</button>
                          </div>
                          <button type="button" class="modal-close-btn text-muted hover:text-white" data-modal="transaction-modal">✕</button>
                      </div>
                      <div id="modal-view-add" class="block space-y-4">
                          <form id="transaction-form" class="space-y-4">
                              <div>
                                  <label class="block text-xs font-bold uppercase tracking-wider text-muted mb-2">Type</label>
                                  <div class="grid grid-cols-2 gap-2 p-1 rounded-xl bg-slate-950 border border-slate-800">
                                      <button type="button" id="type-btn-expense" class="py-2 text-sm font-bold rounded-lg text-rose-400 bg-rose-500/10 border border-rose-500/20" data-type="expense">Expense</button>
                                      <button type="button" id="type-btn-income" class="py-2 text-sm font-bold rounded-lg text-slate-400" data-type="income">Income</button>
                                  </div>
                                  <input type="hidden" id="tx-type" value="expense">
                              </div>
                              <div>
                                  <label class="block text-xs font-bold uppercase tracking-wider text-muted mb-1">Date</label>
                                  <input type="date" id="tx-date" required class="w-full px-3 py-2 rounded-xl border bg-slate-950 border-slate-800 text-sm text-slate-100">
                              </div>
                              <div>
                                  <label class="block text-xs font-bold uppercase tracking-wider text-muted mb-1">Amount ($)</label>
                                  <input type="number" id="tx-amount" min="0.01" step="0.01" required class="w-full px-3 py-2 rounded-xl border bg-slate-950 border-slate-800 text-sm font-semibold text-slate-100">
                              </div>
                              <div>
                                  <label class="block text-xs font-bold uppercase tracking-wider text-muted mb-1">Category</label>
                                  <select id="tx-category" required class="w-full px-3 py-2 rounded-xl border bg-slate-950 border-slate-800 text-sm text-slate-100"></select>
                              </div>
                              <div>
                                  <label class="block text-xs font-bold uppercase tracking-wider text-muted mb-1">Description</label>
                                  <input type="text" placeholder="e.g., Pizza Night Party" id="tx-description" required class="w-full px-3 py-2 rounded-xl border bg-slate-950 border-slate-800 text-sm text-slate-100">
                              </div>
                              <div class="flex justify-end space-x-3 pt-2">
                                  <button type="button" class="modal-close-btn px-4 py-2 text-sm font-medium text-muted hover:text-slate-200" data-modal="transaction-modal">Cancel</button>
                                  <button type="submit" class="px-5 py-2 rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-950 text-sm font-bold">Commit</button>
                              </div>
                          </form>
                      </div>
                      <div id="modal-view-config" class="hidden space-y-4">
                          <form id="category-config-form" class="space-y-4">
                              <div>
                                  <label class="block text-xs font-bold uppercase tracking-wider text-muted mb-1">Destination Target Scope</label>
                                  <select id="cfg-target-type" class="w-full px-3 py-2 rounded-xl border bg-slate-950 border-slate-800 text-sm text-slate-100">
                                      <option value="expense">Expense Categories Bucket</option>
                                      <option value="income">Income Categories Bucket</option>
                                  </select>
                              </div>
                              <div>
                                  <label class="block text-xs font-bold uppercase tracking-wider text-muted mb-1">New Category Label</label>
                                  <input type="text" id="cfg-new-label" placeholder="e.g., Lab Grants, Coffee Cravings" required class="w-full px-3 py-2 rounded-xl border bg-slate-950 border-slate-800 text-sm text-slate-100">
                              </div>
                              <button type="submit" class="w-full py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm">Create Segment Category</button>
                          </form>
                          <div class="border-t border-slate-800 pt-3">
                              <h4 class="text-xs font-bold uppercase tracking-wider text-muted mb-2">Existing Workspace Labels</h4>
                              <div id="cfg-existing-list" class="max-h-32 overflow-y-auto space-y-1.5 custom-scrollbar text-xs"></div>
                          </div>
                      </div>
                  </div>
              </div>

              <!-- IOU Modal restored from previous working Lending Hub -->
              <div id="lending-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm hidden">
                  <div class="w-full max-w-md rounded-2xl border p-6 bg-slate-900 border-amber-500/40 shadow-[0_0_30px_rgba(245,158,11,0.2)]">
                      <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
                          <h3 class="text-lg font-bold text-amber-400">Log Friend IOU</h3>
                          <button type="button" class="modal-close-btn text-muted hover:text-white" data-modal="lending-modal">✕</button>
                      </div>
                      <form id="lending-form" class="space-y-4">
                          <div>
                              <label class="block text-xs font-bold uppercase tracking-wider text-muted mb-2">IOU Direction</label>
                              <select id="lending-type" class="w-full px-3 py-2 rounded-xl border bg-slate-950 border-slate-800 text-sm text-slate-100">
                                  <option value="lent">Lent Money To Someone</option>
                                  <option value="borrowed">Borrowed Money From Someone</option>
                              </select>
                          </div>
                          <div>
                              <label class="block text-xs font-bold uppercase tracking-wider text-muted mb-1">Friend Name</label>
                              <input type="text" id="lending-person" placeholder="e.g., John Doe" required class="w-full px-3 py-2 rounded-xl border bg-slate-950 border-slate-800 text-sm text-slate-100">
                          </div>
                          <div>
                              <label class="block text-xs font-bold uppercase tracking-wider text-muted mb-1">Initial Amount ($)</label>
                              <input type="number" id="lending-amount" min="0.01" step="0.01" required class="w-full px-3 py-2 rounded-xl border bg-slate-950 border-slate-800 text-sm font-semibold text-slate-100">
                          </div>
                          <div>
                              <label class="block text-xs font-bold uppercase tracking-wider text-muted mb-1">Log Date</label>
                              <input type="date" id="lending-date" required class="w-full px-3 py-2 rounded-xl border bg-slate-950 border-slate-800 text-sm text-slate-100">
                          </div>
                          <div class="flex justify-end space-x-3 pt-2">
                              <button type="button" class="modal-close-btn px-4 py-2 text-sm font-medium text-muted hover:text-slate-200" data-modal="lending-modal">Cancel</button>
                              <button type="submit" class="px-5 py-2 rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-950 text-sm font-bold">Log Record</button>
                          </div>
                      </form>
                  </div>
              </div>
              '''

              anchor = '    <footer class="w-full border-t border-slate-900 py-6 text-center text-xs text-muted mt-auto">'
              if anchor not in text:
                  raise SystemExit('Footer anchor not found')
              text = text.replace(anchor, modal_html + '\n\n' + anchor, 1)

              toggle_html = r'''
                    <div id="lending-view-toggle" class="flex flex-wrap gap-2 mb-5">
                        <button type="button" id="lending-view-lent" class="px-4 py-2.5 rounded-xl bg-amber-500 text-slate-950 font-extrabold text-sm border border-amber-400 shadow-lg shadow-amber-500/10">Lending</button>
                        <button type="button" id="lending-view-borrowed" class="px-4 py-2.5 rounded-xl bg-slate-900 text-slate-300 font-extrabold text-sm border border-slate-700 hover:border-rose-400/50">Borrowing</button>
                    </div>
              '''
              route_anchor = '                    <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-6"><div class="p-6 rounded-2xl border interactive-card"><span class="text-xs text-slate-500">Total Lent Outstanding</span>'
              if route_anchor not in text:
                  raise SystemExit('Lending Hub anchor not found')
              text = text.replace(route_anchor, toggle_html + '\n' + route_anchor, 1)

              helper_script = r'''
<script>
/* COINFLOW_CASHLOG_LENDING_RESTORE_V2 */
(function () {
  function openModal(id) {
    var el = document.getElementById(id);
    if (el) el.classList.remove('hidden');
  }
  function closeModal(id) {
    var el = document.getElementById(id);
    if (el) el.classList.add('hidden');
  }

  function setLendingView(view) {
    var lent = document.getElementById('lent-list-container');
    var borrowed = document.getElementById('borrowed-list-container');
    var lentCard = lent ? lent.closest('.interactive-card') : null;
    var borrowedCard = borrowed ? borrowed.closest('.interactive-card') : null;
    var lentBtn = document.getElementById('lending-view-lent');
    var borrowedBtn = document.getElementById('lending-view-borrowed');

    if (view === 'lent') {
      if (lentCard) lentCard.classList.remove('hidden');
      if (borrowedCard) borrowedCard.classList.add('hidden');
      if (lentBtn) lentBtn.className = 'px-4 py-2.5 rounded-xl bg-amber-500 text-slate-950 font-extrabold text-sm border border-amber-400 shadow-lg shadow-amber-500/10';
      if (borrowedBtn) borrowedBtn.className = 'px-4 py-2.5 rounded-xl bg-slate-900 text-slate-300 font-extrabold text-sm border border-slate-700 hover:border-rose-400/50';
    } else {
      if (lentCard) lentCard.classList.add('hidden');
      if (borrowedCard) borrowedCard.classList.remove('hidden');
      if (lentBtn) lentBtn.className = 'px-4 py-2.5 rounded-xl bg-slate-900 text-slate-300 font-extrabold text-sm border border-slate-700 hover:border-amber-400/50';
      if (borrowedBtn) borrowedBtn.className = 'px-4 py-2.5 rounded-xl bg-rose-500 text-white font-extrabold text-sm border border-rose-400 shadow-lg shadow-rose-500/10';
    }
  }

  function bootCashLogAndLending() {
    var dashboardAdd = document.getElementById('dashboard-add-btn');
    var quickAdd = document.getElementById('quick-add-btn');
    var lendingTrigger = document.getElementById('lending-modal-trigger-btn');

    if (dashboardAdd && quickAdd) {
      dashboardAdd.addEventListener('click', function () {
        quickAdd.click();
      });
    }

    if (lendingTrigger) {
      lendingTrigger.addEventListener('click', function () {
        openModal('lending-modal');
        var date = document.getElementById('lending-date');
        if (date) date.valueAsDate = new Date();
      });
    }

    document.querySelectorAll('.modal-close-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        closeModal(btn.getAttribute('data-modal'));
      });
    });

    var lentBtn = document.getElementById('lending-view-lent');
    var borrowedBtn = document.getElementById('lending-view-borrowed');
    if (lentBtn) lentBtn.addEventListener('click', function () { setLendingView('lent'); });
    if (borrowedBtn) borrowedBtn.addEventListener('click', function () { setLendingView('borrowed'); });
    setLendingView('lent');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bootCashLogAndLending, { once: true });
  } else {
    bootCashLogAndLending();
  }
})();
</script>
'''
              text = text.replace('</body>', helper_script + '\n</body>', 1)

              path.write_text(text, encoding='utf-8')
              print('Restored Cash Log modal, IOU modal, dashboard Cash Log trigger, and Lending/Borrowing controls')

      - name: Remove temporary workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/restore-cashlog-lending.yml
          git commit -m "fix: restore cash log modal and lending controls"
          git push
