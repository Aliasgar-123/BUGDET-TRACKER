name: Restore CoinFlow cash log and lending controls

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Cash Log and Lending restoration
        env:
          PATCH_SCRIPT_B64: "5Jvxbk3iMmZ3cnsyIgObc+6rT6tLz7wV7gO4Jr2+zQ=="
        shell: bash
        run: |
          echo "$PATCH_SCRIPT_B64" | base64 --decode > /tmp/patch.py
          python3 /tmp/patch.py

      - name: Commit the actual fix to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/restore-cashlog-lending.yml
          if git diff --cached --quiet; then
            echo "No application changes detected"
            exit 0
          fi
          git commit -m "fix: restore working cash log and lending hub controls"
          git push
