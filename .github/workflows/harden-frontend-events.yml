name: Harden CoinFlow frontend event bindings

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make ID-based event bindings null-safe
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          marker = 'COINFLOW_NULL_SAFE_EVENTS_V1'

          if marker not in ''.join(lines):
              patched = 0
              output = []
              for line in lines:
                  if 'document.getElementById(' in line and ').addEventListener(' in line:
                      line = line.replace(').addEventListener(', ')?.addEventListener(')
                      patched += 1
                  output.append(line)

              print(f'Patched {patched} ID-based event bindings')
              text = ''.join(output)
              marker_script = "\n<!-- COINFLOW_NULL_SAFE_EVENTS_V1 -->\n"
              if '</head>' not in text:
                  raise SystemExit('Could not find </head>')
              text = text.replace('</head>', marker_script + '</head>', 1)
              path.write_text(text, encoding='utf-8')

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/harden-frontend-events.yml
          git commit -m "fix: make frontend event bindings resilient"
          git push
