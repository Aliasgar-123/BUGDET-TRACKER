name: Repair CoinFlow UI runtime

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix theme initialization crash
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = """                if (state.theme === 'dark') {\n                    document.documentElement.className = 'dark';\n                    sunBtn.classList.remove('hidden');\n                    moonBtn.classList.add('hidden');\n                } else {\n                    document.documentElement.className = 'light';\n                    moonBtn.classList.remove('hidden');\n                    sunBtn.classList.add('hidden');\n                }"""
          new = """                if (state.theme === 'dark') {\n                    document.documentElement.className = 'dark';\n                    if (sunBtn) sunBtn.classList.remove('hidden');\n                    if (moonBtn) moonBtn.classList.add('hidden');\n                } else {\n                    document.documentElement.className = 'light';\n                    if (moonBtn) moonBtn.classList.remove('hidden');\n                    if (sunBtn) sunBtn.classList.add('hidden');\n                }"""
          if old not in s:
              raise SystemExit('Expected initTheme block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: prevent missing theme controls from crashing app" || exit 0
          git push origin main
